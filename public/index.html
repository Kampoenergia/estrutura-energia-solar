<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/img/estrutura-logo.jpg">
<title>Estrutura Energia Solar — CRM</title>
<style>
:root{--navy:#063b76;--navy2:#03264d;--orange:#f57c00;--ink:#192235;--muted:#748096;--line:#dfe6ef;--bg:#f3f7fb;--card:#fff;--green:#16834a;--red:#c62828;--blue:#2563eb;}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,system-ui,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--blue);text-decoration:none}
header{padding:16px max(18px,calc((100% - 1220px)/2));background:linear-gradient(110deg,var(--navy2),var(--navy));color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.brand img{width:215px;height:58px;object-fit:contain;background:#fff;border-radius:10px}.brand p{font-size:12px;color:#cfe0f4;margin:4px 0 0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid #ffffff42;background:#ffffff12;color:#fff;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:800}.tab.active,.tab:hover{background:#fff;color:var(--navy)}.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:12px;background:var(--orange);color:#fff;font-size:11px;margin-left:3px}
main{max-width:1220px;margin:auto;padding:22px 18px 55px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 7px 22px #173c650b}.search-row{display:flex;gap:13px;align-items:flex-end;flex-wrap:wrap}.city-field{min-width:220px;flex:1}.segment-field{min-width:340px;flex:3}label{display:block;color:#4b5870;font-size:12px;font-weight:900;margin:0 0 6px;text-transform:uppercase;letter-spacing:.3px}input,select,textarea{width:100%;border:1.4px solid #d5dfeb;border-radius:9px;background:#fff;color:var(--ink);padding:10px 12px;font-size:14px}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--orange);box-shadow:0 0 0 3px #f57c0020}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #d5dfeb;border-radius:18px;padding:7px 10px;color:#5e6c81;background:#fff;font-size:12px;font-weight:800;cursor:pointer}.chip.on{border-color:var(--orange);background:#fff4e8;color:#a14f00}.primary{border:0;border-radius:9px;padding:11px 16px;color:#fff;background:var(--orange);font-weight:900;white-space:nowrap}.primary:disabled{opacity:.6;cursor:wait}.ghost{border:1px solid #ccd7e4;border-radius:8px;padding:8px 11px;color:var(--navy);background:#fff;font-size:12px;font-weight:800}.ghost:hover{background:#f3f7fc}.danger{color:var(--red);border-color:#edbaba}.hint{color:var(--muted);font-size:12px;line-height:1.5;margin:12px 0 0}.empty{background:#fff;border:1px dashed #cdd8e5;border-radius:13px;text-align:center;color:var(--muted);padding:38px 18px;margin-top:16px;line-height:1.6;font-size:14px}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:21px}.topline h2{font-size:19px;color:var(--navy);margin:0}.lead{display:grid;grid-template-columns:46px 1fr auto;gap:14px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px;margin-top:12px}.score{width:43px;height:43px;display:grid;place-items:center;border-radius:12px;color:#fff;font-weight:900}.score.hot{background:#0b8f4d}.score.warm{background:#d97706}.score.cold{background:#8390a2}.lead h3{font-size:16px;color:var(--navy);margin:1px 0 7px}.meta{font-size:12px;line-height:1.65;color:#667389}.meta b{color:#2b3c54}.pill{display:inline-block;background:#fff4df;color:#614b29;border-radius:12px;padding:2px 8px;margin-right:5px;font-size:11px;font-weight:900}.temperature-hot{background:#eaf8ee;color:#08783c}.temperature-warm{background:#fff5df;color:#9a4b00}.temperature-cold{background:#edf1f6;color:#67758a}.money{color:var(--green);font-weight:900}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.result-line{margin-top:10px;font-size:12px;color:#5d6b80;line-height:1.55}.cnpj-box{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:10px}.cnpj-box input{max-width:180px;padding:8px 9px;font-size:12px}.cnpj-data{background:#fffaf4;border-left:3px solid var(--orange);padding:9px 11px;margin-top:9px;color:#657185;font-size:12px;line-height:1.55}.cnpj-data b{color:#22344f}.note{resize:vertical;min-height:50px;margin-top:10px;font-size:12px}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:10px}.controls select{width:auto;min-width:145px;padding:7px 9px;font-size:12px}.check{display:inline-flex;align-items:center;gap:4px;background:#f6f8fb;border:1px solid #e0e6ee;color:#607087;border-radius:8px;padding:6px 8px;font-size:11px;cursor:pointer}.check input{width:auto;accent-color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px}.stat .n{font-size:23px;font-weight:900;color:var(--navy)}.stat .l{font-size:11px;color:var(--muted);margin-top:5px}.filters{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.filters>div{min-width:180px;flex:1}.funnel{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 10px}.stage{border:1px solid #d4deea;border-radius:18px;background:#fff;color:#617087;padding:8px 10px;font-size:11px;font-weight:900;cursor:pointer}.stage.on{background:var(--navy);color:#fff;border-color:var(--navy)}.breakdowns{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:13px}.breakdown{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px}.breakdown h3{font-size:11px;color:#69778c;text-transform:uppercase;margin:0 0 8px}.break-row{display:flex;justify-content:space-between;border-bottom:1px solid #edf0f5;padding:4px 0;font-size:12px;color:#607087}.break-row b{color:var(--orange)}.toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:#fff;padding:12px 15px;border-radius:10px;box-shadow:0 12px 30px #001a3938;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:10;font-size:13px}.toast.show{opacity:1;transform:none}.toast.err{background:#a92323}.spinner{display:inline-block;width:13px;height:13px;border:2px solid #fff8;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:5px}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.breakdowns{grid-template-columns:1fr}}@media(max-width:650px){header{padding:14px}.brand img{width:190px;height:54px}.brand p{display:none}main{padding:15px 12px 40px}.segment-field{min-width:100%}.lead{grid-template-columns:42px 1fr}.lead>.actions{grid-column:2;justify-content:flex-start}.topline{align-items:flex-start;flex-direction:column}.stats{gap:8px}}
</style>
</head>
<body>
<header><div class="brand"><img src="/img/estrutura-wordmark.png" alt="Estrutura Energia Solar"><div><p>Prospecção, qualificação e acompanhamento das oportunidades</p></div></div><nav class="tabs"><a href="/captar" target="_blank"><button class="tab">🌐 Landing pública ↗</button></a><button class="tab active" id="tabP" onclick="showTab('p')">🔎 Prospecção</button><button class="tab" id="tabF" onclick="showTab('f')">📋 Funil <span class="badge" id="leadCount">0</span></button><a href="/logout"><button class="tab">🔒 Sair</button></a></nav></header>
<main>
<section id="viewP"><div class="card"><div class="search-row"><div class="city-field"><label>Cidade para prospectar</label><input id="city" value="Guaramirim" placeholder="Ex.: Jaraguá do Sul"></div><div class="segment-field"><label>Perfis com potencial para energia solar</label><div class="chips" id="segGrid"></div></div><button class="primary" id="searchBtn" onclick="discover()">Buscar leads</button></div><div class="hint">A busca usa estabelecimentos públicos do OpenStreetMap. Confirme o responsável e a fatura antes de abordar.</div></div><div class="topline"><h2>Resultados da prospecção</h2><span class="hint" id="resultCount"></span></div><div id="results"><div class="empty">Escolha uma cidade e os perfis e clique em <b>Buscar leads</b>.</div></div></section>
<section id="viewF" style="display:none"><div class="filters"><div><label>Período</label><select id="period" onchange="loadFunil()"><option value="0">Todos</option><option value="7">Últimos 7 dias</option><option value="30" selected>Últimos 30 dias</option><option value="90">Últimos 90 dias</option></select></div><div><label>Campanha</label><input id="campaign" placeholder="Filtrar campanha" onkeydown="if(event.key==='Enter')loadFunil()"></div><button class="ghost" onclick="clearFilters()">Limpar filtros</button><a href="/api/export.csv"><button class="ghost">⬇ Exportar CSV</button></a></div><div class="stats" id="stats"></div><div class="breakdowns" id="breakdowns"></div><div class="funnel" id="funnel"></div><div id="funnelList"></div></section>
</main><div class="toast" id="toast"></div>
<script>
const STATUSES=[['todos','Todos'],['novo','🆕 Novo'],['contatado','📞 Contato iniciado'],['interessado','💬 Interessado'],['visita_solicitada','📅 Visita solicitada'],['visita_realizada','✅ Visita realizada'],['proposta','📄 Proposta enviada'],['negociacao','🤝 Negociação'],['fechado','🏆 Fechado'],['sem_resposta','⏸ Sem resposta'],['perdido','❌ Perdido']];
const TEMPS=[['quente','🔥 Quente'],['morno','🟡 Morno'],['frio','🔵 Frio']];
let segments=[],selected=new Set(['industria','galpao','supermercado','condominio']),lastResults=[],leads=[],filter='todos';
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>'R$ '+Math.round(Number(n)||0).toLocaleString('pt-BR');
const brl2=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function toast(m,e){const t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(e?' err':'');setTimeout(()=>t.className='toast',2800)}
function showTab(x){document.getElementById('viewP').style.display=x==='p'?'':'none';document.getElementById('viewF').style.display=x==='f'?'':'none';document.getElementById('tabP').className='tab'+(x==='p'?' active':'');document.getElementById('tabF').className='tab'+(x==='f'?' active':'');if(x==='f')loadFunil()}
async function init(){try{segments=await(await fetch('/api/segments')).json();document.getElementById('segGrid').innerHTML=segments.map(s=>`<span class="chip ${selected.has(s.key)?'on':''}" onclick="toggleSeg('${esc(s.key)}',this)">${esc(s.label)}</span>`).join('');await loadFunil()}catch(e){toast('Não foi possível carregar o painel.',true)}}
function toggleSeg(k,e){if(selected.has(k)){selected.delete(k);e.classList.remove('on')}else{selected.add(k);e.classList.add('on')}}
async function discover(){const city=document.getElementById('city').value.trim();if(!city)return toast('Informe a cidade.',true);if(!selected.size)return toast('Escolha um perfil.',true);const b=document.getElementById('searchBtn');b.disabled=true;b.innerHTML='<span class="spinner"></span>Buscando…';document.getElementById('results').innerHTML='<div class="empty">Consultando o mapa em '+esc(city)+'…</div>';try{const r=await fetch('/api/discover',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({city,segments:[...selected]})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Falha na busca');lastResults=d.results||[];renderResults();toast((d.count||0)+' locais encontrados.')}catch(e){document.getElementById('results').innerHTML='<div class="empty">⚠️ '+esc(e.message)+'</div>'}b.disabled=false;b.textContent='Buscar leads'}
function solarLine(l){const parts=[];if(l.systemKwp)parts.push(Number(l.systemKwp).toLocaleString('pt-BR')+' kWp');if(l.panels)parts.push(l.panels+' painéis');if(l.systemValue)parts.push('sistema '+brl(l.systemValue));if(l.economyMonth)parts.push('economia '+brl(l.economyMonth)+'/mês');if(l.financingInstallment)parts.push('parcela '+brl2(l.financingInstallment)+'/mês');if(l.paybackMonths)parts.push('payback '+Number(l.paybackMonths).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' meses');return parts.length?'☀️ '+parts.join(' · '):'☀️ Dimensionamento após análise da fatura'}
function scoreClass(s){return s>=75?'hot':s>=55?'warm':'cold'}
function mapLink(l){return l.lat&&l.lon?` · <a target="_blank" href="https://www.openstreetmap.org/?mlat=${l.lat}&mlon=${l.lon}#map=18/${l.lat}/${l.lon}">mapa</a>`:''}
function renderResults(){const inF=new Set(leads.map(l=>l.id));document.getElementById('resultCount').textContent=lastResults.length?lastResults.length+' locais':'0 locais';if(!lastResults.length){document.getElementById('results').innerHTML='<div class="empty">Nenhum local encontrado. Tente outra cidade ou perfil.</div>';return}document.getElementById('results').innerHTML=lastResults.map((l,i)=>`<article class="lead"><div class="score ${scoreClass(l.score)}">${l.score}</div><div><h3>${esc(l.name)}</h3><div class="meta"><span class="pill">${esc(l.segmentLabel)}</span>${l.city?'🏙️ '+esc(l.city)+' · ':''}${l.address?'📍 '+esc(l.address)+' · ':''}${l.phone?'📞 '+esc(l.phone)+' · ':''}${l.website?'🌐 <a href="'+esc(l.website)+'" target="_blank">site</a>':''}${mapLink(l)}<br>${solarLine(l)}</div></div><div class="actions">${inF.has(l.id)?'<button class="ghost" disabled>✓ No funil</button>':'<button class="primary" onclick="addResult('+i+')">+ Adicionar</button>'}</div></article>`).join('')}
async function addResult(i){const r=await fetch('/api/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lastResults[i])});if(r.ok){toast('Lead adicionado ao funil');await loadFunil();renderResults()}else{const d=await r.json();toast(d.error||'Já está no funil.',true)}}
function clearFilters(){document.getElementById('period').value='30';document.getElementById('campaign').value='';loadFunil()}
function getFiltered(){let a=[...leads];const days=Number(document.getElementById('period').value)||0;const c=document.getElementById('campaign').value.trim().toLowerCase();if(days){const cut=Date.now()-days*86400000;a=a.filter(l=>new Date(l.simulatedAt||l.addedAt||0).getTime()>=cut)}if(c)a=a.filter(l=>String(l.campanha||l.utmCampaign||'').toLowerCase().includes(c));return a}
async function loadFunil(){try{leads=await(await fetch('/api/leads')).json();document.getElementById('leadCount').textContent=leads.length;const a=getFiltered();renderDashboard(a);renderFunnel(a)}catch(e){toast('Erro ao carregar o funil.',true)}}
function renderDashboard(a){const total=a.length,hot=a.filter(l=>l.temperatura==='quente').length,warm=a.filter(l=>l.temperatura==='morno').length,cold=a.filter(l=>l.temperatura==='frio').length,visits=a.filter(l=>l.status==='visita_realizada').length,props=a.filter(l=>l.propostaEnviada||l.status==='proposta'||l.status==='negociacao'||l.status==='fechado').length,sales=a.filter(l=>l.vendaRealizada||l.status==='fechado').length;document.getElementById('stats').innerHTML=`<div class="stat"><div class="n">${total}</div><div class="l">leads no período</div></div><div class="stat"><div class="n" style="color:#16834a">${hot}</div><div class="l">🔥 leads quentes</div></div><div class="stat"><div class="n" style="color:#d97706">${warm}</div><div class="l">🟡 leads mornos</div></div><div class="stat"><div class="n" style="color:#8390a2">${cold}</div><div class="l">🔵 leads frios</div></div><div class="stat"><div class="n">${visits}</div><div class="l">visitas realizadas</div></div><div class="stat"><div class="n">${props}</div><div class="l">propostas enviadas</div></div><div class="stat"><div class="n">${sales}</div><div class="l">vendas</div></div><div class="stat"><div class="n">${total?((sales/total)*100).toLocaleString('pt-BR',{maximumFractionDigits:1}):'0'}%</div><div class="l">taxa de conversão</div></div>`;const count=k=>Object.entries(a.reduce((o,l)=>{const v=String(l[k]||'Não informado');o[v]=(o[v]||0)+1;return o},{})).sort((x,y)=>y[1]-x[1]).slice(0,7).map(([name,count])=>({name,count}));document.getElementById('breakdowns').innerHTML=breakdown('Por cidade',count('city'))+breakdown('Por perfil',count('segmentLabel'))+breakdown('Por campanha',count('campanha'))}
function breakdown(t,a){return `<div class="breakdown"><h3>${t}</h3>${a.length?a.map(x=>`<div class="break-row"><span>${esc(x.name)}</span><b>${x.count}</b></div>`).join(''):'<span class="hint">Sem dados</span>'}</div>`}
function renderFunnel(a){document.getElementById('funnel').innerHTML=STATUSES.map(([k,l])=>{const n=k==='todos'?a.length:a.filter(x=>x.status===k).length;return `<span class="stage ${filter===k?'on':''}" onclick="filter='${k}';renderFunnel(getFiltered())">${l} (${n})</span>`}).join('');const list=filter==='todos'?a:a.filter(l=>l.status===filter);document.getElementById('funnelList').innerHTML=list.length?[...list].sort((x,y)=>(y.score||0)-(x.score||0)).map(renderCard).join(''):'<div class="empty">Nenhuma oportunidade nesta etapa.</div>'}
function tempPill(t){return `<span class="pill temperature-${t}">${t==='quente'?'🔥 Quente':t==='morno'?'🟡 Morno':'🔵 Frio'}</span>`}
function waPhone(v){let d=String(v||'').replace(/\D/g,'');if(d.startsWith('55'))d=d.slice(2);if(d.startsWith('0'))d=d.slice(1);return d?'55'+d:''}
function isMobile(v){let d=String(v||'').replace(/\D/g,'');if(d.startsWith('55'))d=d.slice(2);if(d.startsWith('0'))d=d.slice(1);return d.length===11&&d[2]==='9'}
function contactAction(v){if(!v)return '';return isMobile(v)?`<a target="_blank" href="https://wa.me/${waPhone(v)}"><button class="ghost">💚 WhatsApp</button></a>`:`<a href="tel:+${waPhone(v)}"><button class="ghost">📞 Ligar</button></a>`}
function renderCard(l){const t=l.temperatura||'frio';const source=[l.origem,l.campanha].filter(Boolean).join(' · ');const flags=`<label class="check"><input type="checkbox" ${l.faturaRecebida?'checked':''} onchange="flag('${esc(l.id)}','faturaRecebida',this.checked)"> Fatura</label><label class="check"><input type="checkbox" ${l.propostaEnviada?'checked':''} onchange="flag('${esc(l.id)}','propostaEnviada',this.checked)"> Proposta</label><label class="check"><input type="checkbox" ${l.vendaRealizada?'checked':''} onchange="flag('${esc(l.id)}','vendaRealizada',this.checked)"> Venda</label>`;const cnpj=l.tipo==='PJ'?`<div class="cnpj-box"><input id="cnpj-${esc(l.id)}" placeholder="CNPJ para enriquecer" value="${esc(l.cnpj||'')}"><button class="ghost" onclick="enrich('${esc(l.id)}')">🔎 CNPJ</button></div>`:'';return `<article class="lead"><div class="score ${scoreClass(l.score)}">${l.score||0}</div><div><h3>${esc(l.name)}</h3><div class="meta"><span class="pill">${esc(l.segmentLabel||'Energia solar')}</span>${tempPill(t)}${l.origem==='landing'?'<span class="pill">🌐 Landing</span>':''}${l.city?'🏙️ '+esc(l.city)+' · ':''}${l.address?'📍 '+esc(l.address)+' · ':''}${l.phone?'📞 '+esc(l.phone)+' · ':''}${source?'📣 '+esc(source)+' · ':''}${l.simulatedAt?'🕒 '+formatDate(l.simulatedAt):''}<br>${l.contaEst?'Conta: <b>'+brl(l.contaEst)+'/mês</b> · ':''}${solarLine(l)}</div>${cnpj}<div class="actions" style="justify-content:flex-start;margin-top:10px">${contactAction(l.phone)}<button class="ghost" onclick="copyPitch('${esc(l.id)}')">📋 Copiar abordagem</button><button class="ghost danger" onclick="delLead('${esc(l.id)}')">🗑 Excluir</button></div>${l.cnpjData?`<div class="cnpj-data"><b>${esc(l.cnpjData.razao_social||l.cnpjData.nome_fantasia||'Empresa')}</b> · ${esc(l.cnpjData.situacao||'')} · ${esc(l.cnpjData.porte||'')}<br>${esc(l.cnpjData.cnae||'')}${l.cnpjData.email?' · ✉️ '+esc(l.cnpjData.email):''}</div>`:''}<textarea class="note" placeholder="Notas e próximo passo…" onchange="saveNotes('${esc(l.id)}',this.value)">${esc(l.notes||'')}</textarea><div class="controls"><select onchange="setStatus('${esc(l.id)}',this.value)">${STATUSES.filter(x=>x[0]!=='todos').map(([k,label])=>`<option value="${k}" ${l.status===k?'selected':''}>${label}</option>`).join('')}</select><select onchange="setTemp('${esc(l.id)}',this.value)">${TEMPS.map(([k,label])=>`<option value="${k}" ${t===k?'selected':''}>${label}</option>`).join('')}</select>${flags}</div></div></article>`}
function formatDate(v){try{return new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}catch{return ''}}
async function patch(id,b){const r=await fetch('/api/leads/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw new Error('Não foi possível salvar');return r.json()}
async function setStatus(id,v){try{await patch(id,{status:v});toast('Status atualizado');await loadFunil()}catch(e){toast(e.message,true)}}
async function setTemp(id,v){try{await patch(id,{temperatura:v,temperaturaManual:true});toast('Temperatura atualizada');await loadFunil()}catch(e){toast(e.message,true)}}
async function flag(id,k,v){try{await patch(id,{[k]:v});toast('Campo atualizado');await loadFunil()}catch(e){toast(e.message,true)}}
async function saveNotes(id,v){try{await patch(id,{notes:v});toast('Observação salva')}catch(e){toast(e.message,true)}}
async function delLead(id){if(!confirm('Excluir este lead?'))return;await fetch('/api/leads/'+encodeURIComponent(id),{method:'DELETE'});await loadFunil();toast('Lead excluído')}
async function enrich(id){const i=document.getElementById('cnpj-'+id),c=(i&&i.value||'').replace(/\D/g,'');if(c.length!==14)return toast('CNPJ inválido.',true);try{const r=await fetch('/api/cnpj/'+c),d=await r.json();if(!r.ok)throw new Error(d.error||'CNPJ não encontrado');await patch(id,{cnpj:c,cnpjData:d});toast('CNPJ atualizado');await loadFunil()}catch(e){toast(e.message,true)}}
function copyPitch(id){const l=leads.find(x=>x.id===id);if(!l)return;const p=`Olá, ${String(l.name||'').split(' ')[0]}! Tudo bem? Aqui é da Estrutura Energia Solar. Estamos atendendo ${l.city||'a região'} e fazendo análises de soluções fotovoltaicas para imóveis como o seu. Posso verificar sua conta de energia e preparar uma avaliação sem compromisso?`;navigator.clipboard.writeText(p).then(()=>toast('Abordagem copiada.')).catch(()=>window.prompt('Copie a abordagem:',p))}
init();
</script>
